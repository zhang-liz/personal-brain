name: Test

# Runs once per pull request, on the oldest Python we support. A new push to a pull request
# cancels the run before it. Run it by hand before a release to add newer Pythons:
#   gh workflow run test.yml
# A pull request that changes only docs skips the steps, in this same job: `main` requires the
# check "test (3.10)", and there must be only one check with that name.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.10"]') || fromJSON('["3.10", "3.12", "3.15"]') }}
    steps:
      - name: Find out if only docs changed
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=""
          if [ -n "$PR" ]; then
            files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          fi
          if [ -n "$files" ] && ! echo "$files" | grep -vE '(\.md$|^docs/)' > /dev/null; then
            echo "Only docs changed. The code tests do not run."
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.code
        uses: actions/checkout@v7
      - if: steps.changes.outputs.code
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - if: steps.changes.outputs.code
        run: python -m venv .venv && .venv/bin/pip install -e ".[test]" uv
      - if: steps.changes.outputs.code
        run: .venv/bin/uvx ruff@0.17.3 check src tests scripts
      # The README names the first version. Users may still run the older one.
      - name: Test on FalkorDB 6.0.4 and 4.22.2
        if: steps.changes.outputs.code
        run: |
          for image in falkordb/falkordb:6.0.4 falkordb/falkordb:v4.22.2; do
            echo "::group::$image"
            docker run -d --name db -p 6379:6379 "$image"
            for i in $(seq 1 30); do (exec 3<>/dev/tcp/localhost/6379) 2>/dev/null && break; sleep 1; done
            PATH="$PWD/.venv/bin:$PATH" .venv/bin/python -m pytest -x
            docker rm -f db
            echo "::endgroup::"
          done
