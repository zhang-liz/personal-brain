name: Test

# The tests skip a pull request that changes only docs, but `main` requires the check "test (3.10)".
# This gives such a pull request that check in a few seconds, so that it can merge.
on:
  pull_request:
    paths: ["**.md", "docs/**"]

jobs:
  docs:
    name: test (3.10)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs changed. The code tests run only when code changes."
