[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-brain"
dynamic = ["version"]
description = "MCP server that gives your AI agent memory of your professional network: your LinkedIn connections as a graph in FalkorDB, with a 3D viewer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "mcp-server", "model-context-protocol", "agent-memory", "falkordb", "knowledge-graph", "linkedin"]
authors = [{ name = "Liz Zhang" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "falkordb==1.8.1",
    "igraph==1.0.0",
    "mcp>=2.3,<3",
    "redis",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/zhang-liz/personal-brain"
Demo = "https://zhang-liz.github.io/personal-brain/"
Issues = "https://github.com/zhang-liz/personal-brain/issues"
Changelog = "https://github.com/zhang-liz/personal-brain/blob/main/CHANGELOG.md"

[project.scripts]
personal-brain = "personal_brain.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741"]

[tool.hatch.version]
path = "src/personal_brain/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_brain"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]
